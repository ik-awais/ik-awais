<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Muhammad Awais terminal header" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061A14"/>
      <stop offset="55%" stop-color="#01411C"/>
      <stop offset="100%" stop-color="#006B3C"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7DD3FC" opacity="0.10"/>
    </pattern>
    <clipPath id="panelClip">
      <rect x="60" y="40" width="880" height="280" rx="14"/>
    </clipPath>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1000" height="360" fill="url(#bgGrad)"/>
  <rect width="1000" height="360" fill="url(#grid)"/>

  <g filter="url(#panelShadow)">
    <g clip-path="url(#panelClip)">
      <rect x="60" y="40" width="880" height="280" fill="#0B1F17"/>
      <rect x="60" y="40" width="880" height="34" fill="#0F2A1D"/>
      <circle cx="90" cy="57" r="6" fill="#38BDF8"/>
      <circle cx="112" cy="57" r="6" fill="#7DD3FC"/>
      <circle cx="134" cy="57" r="6" fill="#006B3C"/>
      <text x="500" y="61" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#7DD3FC" fill-opacity="0.55">awais@aigenmat: ~</text>
      <line x1="60" y1="74" x2="940" y2="74" stroke="#113B27" stroke-width="1"/>
    </g>
    <rect x="60" y="40" width="880" height="280" rx="14" fill="none" stroke="#113B27" stroke-width="1.5"/>
  </g>

  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">
    <g opacity="0">
      <text x="90" y="104" font-size="15"><tspan fill="#38BDF8">awais@aigenmat:~$ </tspan><tspan fill="#F8FAFC">whoami</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.4s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="90" y="146" font-size="26" font-weight="700"><tspan fill="#38BDF8">&gt; </tspan><tspan fill="#F8FAFC">Muhammad Awais</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.4s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="90" y="186" font-size="15"><tspan fill="#38BDF8">awais@aigenmat:~$ </tspan><tspan fill="#F8FAFC">cat identity.yaml</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.4s" fill="freeze"/>
    </g>

    <g opacity="0" font-size="15">
      <text x="90" y="212"><tspan fill="#7DD3FC">role:      </tspan><tspan fill="#F8FAFC">AI Developer / AI Engineer</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.3s" fill="freeze"/>
    </g>
    <g opacity="0" font-size="15">
      <text x="90" y="236"><tspan fill="#7DD3FC">current:   </tspan><tspan fill="#F8FAFC">Operations Associate @ AI GenMat</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.3s" fill="freeze"/>
    </g>
    <g opacity="0" font-size="15">
      <text x="90" y="260"><tspan fill="#7DD3FC">previous:  </tspan><tspan fill="#F8FAFC">Managing Director @ AI GenMat</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.3s" fill="freeze"/>
    </g>
    <g opacity="0" font-size="15">
      <text x="90" y="284"><tspan fill="#7DD3FC">degree:    </tspan><tspan fill="#F8FAFC">BS Software Engineering, FAST-NUCES Islamabad</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.3s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="90" y="310" font-size="15" fill="#38BDF8">awais@aigenmat:~$</text>
      <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.3s" fill="freeze"/>
    </g>
    <rect x="222" y="298" width="10" height="18" fill="#38BDF8" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.3s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
